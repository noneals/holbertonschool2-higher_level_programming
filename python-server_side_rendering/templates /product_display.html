<!doctype html>
<html lang="en">
<head>
  <title>Product Display</title>
</head>
<body>
  {% include 'header.html' %}

  <h1>Product Display</h1>

  {% if error %}
    <p>{{ error }}</p>
  {% else %}
    {% if products %}
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Category</th>
            <th>Price</th>
          </tr>
        </thead>
        <tbody>
          {% for p in products %}
            <tr>
              <td>{{ p.name }}</td>
              <td>{{ p.category }}</td>
              <td>{{ p.price }}</td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
    {% else %}
      <p>No products available</p>
    {% endif %}
  {% endif %}

  {% include 'footer.html' %}
</body>
</html>
